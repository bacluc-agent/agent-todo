name: Hourly issue runner

on:
  schedule:
    - cron: "24 * * * *"
  workflow_dispatch:
    inputs:
      selection_prompt:
        description: Optional override for the selection instruction tail (the candidate list is always prepended)
        required: false
        type: string

permissions:
  actions: write
  artifact-metadata: write
  checks: read
  packages: write
  contents: write
  issues: write
  pull-requests: write

jobs:
  select:
    # ponytail: the agent-running claim label is never removed by these workflows, so issues that
    # fail, or succeed without closing, are permanently retired from selection; upgrade path is
    # unlabeling on completion/failure or timeout-based claims.
    runs-on: ubuntu-latest
    timeout-minutes: 120
    outputs:
      prompt: ${{ steps.pick.outputs.prompt }}
      task-context: ${{ steps.pick.outputs.task-context }}
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      OPENCODE_GO_API_KEY: ${{ secrets.OPENCODE_GO_API_KEY }}
      OPENCODE_GO_2_API_KEY: ${{ secrets.OPENCODE_GO_2_API_KEY }}

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: bacluc-agent/agent-todo
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up OpenCode
        uses: ./.github/actions/setup-opencode
        with:
          source-ref: fba0fd4dbebf9b1ca612792d76d756149e6be93b

      - name: Pick issue and dispatch
        id: pick
        shell: bash
        env:
          SELECTION_PROMPT: ${{ inputs.selection_prompt }}
        run: |
          set -Eeuo pipefail

          printf '::add-mask::%s\n' "$GITHUB_TOKEN"
          printf '::add-mask::%s\n' "$OPENCODE_GO_API_KEY"
          printf '::add-mask::%s\n' "$OPENCODE_GO_2_API_KEY"

          gh label create agent-running -R "$GITHUB_REPOSITORY" \
            --color 0E8A16 --description 'Selected by the hourly issue runner' --force

          # gh issue list -S returns nothing for no:label:<name> (gh client filter); the search API works.
          # Oldest-first: the 50-item page keeps the OLDEST 50 unclaimed issues instead of the
          # newest 50, so backlog items beyond the cap are the newest, not the oldest.
          search_json="$RUNNER_TEMP/candidates.json"
          gh api "search/issues?q=repo:${GITHUB_REPOSITORY}+is:open+is:issue+no:label:agent-running+sort:created-asc&per_page=50" \
            --jq '.items' > "$search_json"

          candidates="$RUNNER_TEMP/candidate-numbers.txt"
          jq -r '.[].number | tostring' "$search_json" > "$candidates"
          if [[ ! -s "$candidates" ]]; then
            printf '%s\n' 'No unclaimed open issues; nothing to do.'
            exit 0
          fi
          printf 'Unclaimed candidate issues (oldest first):\n'
          cat "$candidates"

          available_models="$RUNNER_TEMP/opencode-models.out"
          set +e
          timeout 10m opencode models 2>&1 | tee "$available_models"
          availability_statuses=("${PIPESTATUS[@]}")
          availability_status=${availability_statuses[0]}
          availability_tee_status=${availability_statuses[1]}
          set -e
          if (( availability_tee_status != 0 )); then
            exit "$availability_tee_status"
          fi
          if (( availability_status != 0 )); then
            printf 'Unable to verify model availability; not dispatching.\n' >&2
            exit "$availability_status"
          fi
          selection_model=''
          mapfile -t free_models < <(grep -Eo 'opencode/[^[:space:]]+-free' "$available_models" | awk '!seen[$0]++')
          for candidate in "${free_models[@]}"; do
            case "$candidate" in
              opencode/*-free) ;;
              *) continue ;;
            esac
            probe_output="$RUNNER_TEMP/model-probe-${candidate//\//-}.out"
            printf 'Model probe command: timeout 10s opencode --pure run --dir %q --model %q [prompt omitted]\n' "$RUNNER_TEMP" "$candidate"
            set +e
            timeout 10s opencode --pure run --dir "$RUNNER_TEMP" --model "$candidate" 'Respond with exactly OK.' 2> >(tee "${probe_output}.stderr" >&2) | tee "$probe_output"
            probe_statuses=("${PIPESTATUS[@]}")
            set -e
            probe_status=${probe_statuses[0]}
            probe_tee_status=${probe_statuses[1]}
            printf 'Model probe statuses: opencode=%s tee=%s\n' "$probe_status" "$probe_tee_status"
            probe_text="$(< "$probe_output")"
            if (( probe_status == 0 && probe_tee_status == 0 )) && [[ "$probe_text" =~ ^[[:space:]]*OK\.?[[:space:]]*$ ]]; then
              selection_model="$candidate"
              break
            fi
          done
          if [[ -z "$selection_model" ]]; then
            printf '%s\n' 'No verified free issue-selection model; checking paid Qwen bootstrap.' >&2
            for candidate in 'opencode-go-openai/qwen3.8-flash' 'opencode-go-openai-2/qwen3.8-flash'; do
              case "$candidate" in
                opencode-go-openai/qwen3.8-flash) [[ -n "$OPENCODE_GO_API_KEY" ]] || continue ;;
                opencode-go-openai-2/qwen3.8-flash) [[ -n "$OPENCODE_GO_2_API_KEY" ]] || continue ;;
              esac
              grep -Fxq "$candidate" "$available_models" || continue
              probe_output="$RUNNER_TEMP/model-probe-${candidate//\//-}.out"
              set +e
              timeout 10s opencode --pure run --dir "$RUNNER_TEMP" --model "$candidate" 'Respond with exactly OK.' 2> >(tee "${probe_output}.stderr" >&2) | tee "$probe_output"
              probe_statuses=("${PIPESTATUS[@]}")
              set -e
              probe_text="$(< "$probe_output")"
              if (( probe_statuses[0] == 0 && probe_statuses[1] == 0 )) && [[ "$probe_text" =~ ^[[:space:]]*OK\.?[[:space:]]*$ ]]; then
                selection_model="$candidate"
                break
              fi
            done
          fi
          if [[ -z "$selection_model" ]]; then
            printf '%s\n' 'No issue-selection model is available; not dispatching.' >&2
            exit 1
          fi
          printf 'Issue selection model: %s\n' "$selection_model"

          default_tail="$(cat scripts/issue-selection-tail.txt)"
          tail_instruction="${SELECTION_PROMPT:-$default_tail}"

          prompt="$RUNNER_TEMP/selection-prompt.txt"
          {
            printf '%s\n' 'Open issue candidates in this repository (number: title, oldest first):'
            jq -r '.[] | "\(.number): \(.title)"' "$search_json"
            printf '%s\n' "$tail_instruction"
          } > "$prompt"

          selection="$RUNNER_TEMP/selection.out"
          set +e
          timeout 10m opencode run --agent issue-selector --model "$selection_model" "$(< "$prompt")" 2> >(tee "${selection}.stderr" >&2) | tee "$selection"
          selection_statuses=("${PIPESTATUS[@]}")
          selection_status=${selection_statuses[0]}
          selection_tee_status=${selection_statuses[1]}
          set -e
          printf 'Model selection statuses: opencode=%s tee=%s\n' "$selection_status" "$selection_tee_status"
          if (( selection_tee_status != 0 )); then
            exit "$selection_tee_status"
          fi
          if (( selection_status != 0 )); then
            printf 'Selection failed (opencode=%s); not dispatching.\n' "$selection_status" >&2
            exit 1
          fi
          if ! grep -q '[^[:space:]]' "$selection"; then
            printf '%s\n' 'Selection produced no output; not dispatching.' >&2
            exit 1
          fi

          eof="EOF_PROMPT_$(openssl rand -hex 32)"
          if grep -Fqx -- "$eof" "$selection"; then
            printf '%s\n' 'Selection output contained the output delimiter; not dispatching.' >&2
            exit 1
          fi
          {
            printf 'prompt<<%s\n' "$eof"
            printf '%s\n' "$(< "$selection")"
            printf '%s\n' "$eof"
            printf 'task-context<<%s\n' "$eof"
            jq -cn --arg task "$(< "$selection")" '{phase:"coordinate", complexity:"medium", importance:"medium", risk:"medium", required_capabilities:["coding","shell"], runtime_constraints:["github-actions","bounded-time"], roles:["coordinator"], scope:["agent-todo repository"], task:$task, model_overrides:{}}'
            printf '%s\n' "$eof"
          } >> "$GITHUB_OUTPUT"

          printf '%s\n' 'Implementation prompt:'
          cat "$selection"

  run:
    needs: select
    if: needs.select.outputs.prompt != ''
    permissions:
      actions: write
      artifact-metadata: write
      checks: read
      packages: write
      contents: write
      issues: write
      pull-requests: write
    uses: ./.github/workflows/opencode.yml
    with:
      prompt: ${{ needs.select.outputs.prompt }}
      task-context: ${{ needs.select.outputs.task-context }}
    secrets: inherit
