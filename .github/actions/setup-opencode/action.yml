name: Set up OpenCode
description: >-
  Installs the OpenCode CLI and prepares the shared OpenCode configuration
  from the provision-machines repository. Relies on the job-level
  GITHUB_TOKEN and at least one OPENCODE_GO API key env var set by the caller.
runs:
  using: composite
  steps:
    - name: Install OpenCode
      shell: bash
      run: npm install --global opencode-ai@1.18.21

    - name: Fetch and prepare OpenCode configuration
      id: config
      shell: bash
      env:
        SOURCE_REPOSITORY: https://github.com/bacluc/provision-machines.git
        CONFIG_PATH: deploys/development_tools/ai_agent_devcontainer/files/opencode
        SKILLS_PATH: deploys/development_tools/ai_agent_devcontainer/files/claude/skills
      run: |
        set -Eeuo pipefail

        printf '::add-mask::%s\n' "$GITHUB_TOKEN"
        printf '::add-mask::%s\n' "${OPENCODE_GO_API_KEY:-}"
        printf '::add-mask::%s\n' "${OPENCODE_GO_2_API_KEY:-}"
        source_dir="$RUNNER_TEMP/provision-machines"
        config_dir="$RUNNER_TEMP/opencode-config"
        mapfile -t tags < <(git ls-remote --tags "$SOURCE_REPOSITORY" \
          | awk '$2 !~ /\^\{\}$/ { sub("refs/tags/", "", $2); print $2 }' \
          | grep -E '^[vV]?[0-9]+([.][0-9]+){1,2}([-.][0-9A-Za-z.-]+)?$' \
          | sort -V)

        if ((${#tags[@]} == 0)); then
          printf '%s\n' 'No semver tags found in the source repository' >&2
          exit 1
        fi

        tag="${tags[${#tags[@]}-1]}"
        tag_refs="$(git ls-remote --tags "$SOURCE_REPOSITORY" "refs/tags/$tag" "refs/tags/$tag^{}")"
        tag_sha="$(printf '%s\n' "$tag_refs" | awk -v tag="$tag" \
          '$2 == "refs/tags/" tag "^{}" { peeled=$1 } $2 == "refs/tags/" tag { direct=$1 } END { print peeled ? peeled : direct }')"
        if [[ ! "$tag_sha" =~ ^[0-9a-f]{40}$ ]]; then
          printf 'Unable to resolve source config tag to a commit: %s\n' "$tag" >&2
          exit 1
        fi
        printf 'Using source config tag: %s (commit %s)\n' "$tag" "$tag_sha"
        git clone --quiet "$SOURCE_REPOSITORY" "$source_dir"
        cloned_tag_sha="$(git -C "$source_dir" rev-parse --verify "refs/tags/$tag^{commit}" 2>/dev/null || true)"
        if [[ "$cloned_tag_sha" != "$tag_sha" ]]; then
          printf 'Source config tag changed while cloning: expected %s, got %s\n' "$tag_sha" "${cloned_tag_sha:-unresolved}" >&2
          exit 1
        fi
        git -C "$source_dir" checkout --quiet --detach "$tag_sha"
        if [[ ! -d "$source_dir/$CONFIG_PATH" ]]; then
          printf 'Missing OpenCode configuration directory: %s\n' "$CONFIG_PATH" >&2
          exit 1
        fi
        rm -rf "$config_dir"
        cp -a "$source_dir/$CONFIG_PATH" "$config_dir"

        if [[ ! -d "$source_dir/$SKILLS_PATH" ]]; then
          printf 'Missing skills directory: %s\n' "$SKILLS_PATH" >&2
          exit 1
        fi
        if [[ -z "$(compgen -G "$source_dir/$SKILLS_PATH/*/SKILL.md" 2>/dev/null)" ]]; then
          printf 'No SKILL.md files found in skills directory: %s\n' "$SKILLS_PATH" >&2
          exit 1
        fi
        cp -a "$source_dir/$SKILLS_PATH" "$config_dir/skills"
        printf 'Copied skills: %s\n' "$(ls "$config_dir/skills" | tr '\n' ' ')"

        python3 - "$config_dir" <<'PY'
        import pathlib
        import re
        import sys

        root = pathlib.Path(sys.argv[1])
        instruction = """

        ## Agent progress and branches

        Track progress in an issue in https://github.com/bacluc-agent/agent-todo. Use the assigned issue, or create one when none is assigned, and continue from that issue. Always push changes to a branch so work is not lost, and record the branch name in the issue.
        """

        for path in root.rglob("*"):
            if path.is_file() and path.name.lower() in {"agents.md", "agent.md"} \
                    and path.stem.lower() != "model-discovery":
                path.write_text(path.read_text() + instruction)

        config = root / "opencode.jsonc"
        text = config.read_text()
        pattern = re.compile(
            r'("opencode-go-(?:anthropic|openai)(-2)?"\s*:\s*\{.*?'
            r'"options"\s*:\s*\{)(.*?)(\}\s*,\s*"models")',
            re.DOTALL,
        )
        def add_api_key(match):
            key = "OPENCODE_GO_2_API_KEY" if match.group(2) else "OPENCODE_GO_API_KEY"
            return f'{match.group(1)}\n        "apiKey": "{{env:{key}}}",{match.group(3)}{match.group(4)}'

        text, count = pattern.subn(add_api_key, text)
        if count != 4:
            raise SystemExit(f"Expected four OpenCode Go providers, found {count}")

        # Disable the vshn-us-ai provider: all models failed during probing
        # due to broken baseURL ("undefined/chat/completions")
        text = text.replace(
            '"vshn-us-ai": {\n      "npm": "@ai-sdk/openai-compatible",\n      "name": "VSHN US AI",',
            '"vshn-us-ai": {\n      "npm": "@ai-sdk/openai-compatible",\n      "name": "VSHN US AI",\n      "disabled": true,'
        )

        # Add a comment about known-broken models if not already present
        if "Known broken models" not in text:
            text = text.replace(
                '"provider": {',
                '// Known broken models from failed run 34011838269:\n'
                '// - vshn-us-ai: broken baseURL ("undefined/chat/completions")\n'
                '// - opencode-go-openai: grok-4.6 fails with "not supported for format oa-compat"\n'
                '// - opencode-go-anthropic-2: models fail with server errors\n'
                '"provider": {'
            )

        config.write_text(text)

        # model-discovery.md is expected in the provision-machines repo's config directory.
        # If it's missing, log a warning but do not fail the setup, as the file may not
        # exist in all versions of the provision-machines repo.
        discovery = root / "agents" / "model-discovery.md"
        if not discovery.exists():
            print(f"Warning: model-discovery agent file not found at {discovery}; skipping agent config step")
        else:
            discovery.write_text(discovery.read_text())
        PY

        mkdir -p "$HOME/.config"
        rm -rf "$HOME/.config/opencode"
        cp -a "$config_dir" "$HOME/.config/opencode"
